[project]
name = "overlap-viewer"
version = "0.1.0"
description = "GUI to inspect how the real instances of a 3W well overlap in time and how their fault labels differ."
readme = "README.md"
authors = [
    { name = "Thiago-TP", email = "thiagotomasdepaula@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyqtgraph>=0.13.7",
    "PySide6>=6.8",
]

[project.scripts]
overlap-viewer = "overlap_viewer.app:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["overlap_viewer"]

[tool.ruff.format]
quote-style = "double"
